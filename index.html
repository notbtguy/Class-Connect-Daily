<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassConnect Daily - Teacher Update Tool</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf.js for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* A4 Paper Simulation for Preview */
        .a4-paper {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 0 auto;
            padding: 20mm;
            position: relative;
        }

        @media (max-width: 768px) {
            .a4-paper {
                padding: 15px;
                min-height: auto;
            }
        }
        
        /* Print specific styles */
        .print-content {
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icon Components using SVG directly for better PDF compatibility than external scripts sometimes
        const IconDownload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const IconCopy = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const IconPlus = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        );
        const IconTrash = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        );
        const IconBook = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        );

        const App = () => {
            const [loading, setLoading] = useState(false);
            const previewRef = useRef(null);

            // Initial State
            const [formData, setFormData] = useState({
                schoolName: "Greenwood High School",
                teacherName: "Mr. Sharma",
                grade: "Grade 5",
                subject: "Science",
                date: new Date().toISOString().split('T')[0],
                topic: "Photosynthesis",
                context: "Today we introduced how plants make their own food. We focused on the role of sunlight and chlorophyll.",
                contentCovered: "1. Definition of Photosynthesis\n2. Importance of Sunlight\n3. The equation of Photosynthesis",
                readingAssignment: "Read Chapter 4, Pages 42-45.",
                questions: [
                    "What is the green pigment in plants called?",
                    "What gas do plants release during photosynthesis?",
                    "Why is sunlight important for plants?",
                    "What are the two main ingredients plants need?",
                    "Draw a simple diagram of a plant making food."
                ]
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleQuestionChange = (index, value) => {
                const newQuestions = [...formData.questions];
                newQuestions[index] = value;
                setFormData(prev => ({ ...prev, questions: newQuestions }));
            };

            const addQuestion = () => {
                setFormData(prev => ({ ...prev, questions: [...prev.questions, ""] }));
            };

            const removeQuestion = (index) => {
                const newQuestions = formData.questions.filter((_, i) => i !== index);
                setFormData(prev => ({ ...prev, questions: newQuestions }));
            };

            const generatePDF = () => {
                setLoading(true);
                const element = document.getElementById('pdf-preview-content');
                
                const opt = {
                    margin: 0,
                    filename: `${formData.subject}_${formData.date}_Update.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    setLoading(false);
                });
            };

            const copyTextSummary = () => {
                const text = `
📅 *Daily Update - ${formData.date}*
🏫 ${formData.schoolName}
👨‍🏫 ${formData.teacherName} | ${formData.grade} | ${formData.subject}

*Topic:* ${formData.topic}

*Today's Context:*
${formData.context}

*Content Covered:*
${formData.contentCovered}

*📚 Reading Assignment:*
${formData.readingAssignment}

*❓ Review Questions:*
${formData.questions.map((q, i) => `${i+1}. ${q}`).join('\n')}
                `;
                
                navigator.clipboard.writeText(text.trim());
                alert("Summary copied to clipboard! You can paste this directly into WhatsApp.");
            };

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    {/* Left Side: Editor Form */}
                    <div className="w-full lg:w-1/3 bg-white border-r border-gray-200 h-auto lg:h-screen overflow-y-auto p-6 shadow-xl z-10">
                        <div className="flex items-center gap-2 mb-6 text-blue-700">
                            <IconBook />
                            <h1 className="text-2xl font-bold tracking-tight">DailyConnect</h1>
                        </div>
                        
                        <p className="text-sm text-gray-500 mb-6">Fill in the details below to generate a daily update card for parents.</p>

                        <div className="space-y-4">
                            {/* Meta Data */}
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Date</label>
                                    <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Subject</label>
                                    <input type="text" name="subject" value={formData.subject} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Grade/Class</label>
                                    <input type="text" name="grade" value={formData.grade} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Teacher</label>
                                    <input type="text" name="teacherName" value={formData.teacherName} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">School Name</label>
                                <input type="text" name="schoolName" value={formData.schoolName} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                            </div>

                            <hr className="my-4"/>

                            {/* Core Content */}
                            <div>
                                <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Chapter / Topic</label>
                                <input type="text" name="topic" value={formData.topic} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="e.g. Thermodynamics" />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Context / Summary</label>
                                <textarea name="context" value={formData.context} onChange={handleInputChange} rows="3" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Brief summary of what happened today..."></textarea>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">Content Covered (Key Points)</label>
                                <textarea name="contentCovered" value={formData.contentCovered} onChange={handleInputChange} rows="3" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="List the main concepts..."></textarea>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-gray-700 uppercase mb-1">To Read / Homework</label>
                                <input type="text" name="readingAssignment" value={formData.readingAssignment} onChange={handleInputChange} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="e.g. Read pg 10-15" />
                            </div>

                            {/* Questions Section */}
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="block text-xs font-semibold text-gray-700 uppercase">Review Questions</label>
                                    <button onClick={addQuestion} className="text-xs flex items-center gap-1 bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                                        <IconPlus /> Add
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {formData.questions.map((q, index) => (
                                        <div key={index} className="flex gap-2">
                                            <span className="text-gray-400 text-sm py-2">{index + 1}.</span>
                                            <input 
                                                type="text" 
                                                value={q} 
                                                onChange={(e) => handleQuestionChange(index, e.target.value)}
                                                className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                                placeholder="Question..."
                                            />
                                            <button onClick={() => removeQuestion(index)} className="text-red-400 hover:text-red-600">
                                                <IconTrash />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right Side: Preview & Actions */}
                    <div className="w-full lg:w-2/3 bg-gray-100 flex flex-col h-screen">
                        
                        {/* Toolbar */}
                        <div className="bg-white p-4 border-b border-gray-200 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-20 shadow-sm">
                            <h2 className="font-semibold text-gray-700">Preview</h2>
                            <div className="flex gap-2">
                                <button 
                                    onClick={copyTextSummary}
                                    className="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors text-sm font-medium"
                                >
                                    <IconCopy /> Copy Text
                                </button>
                                <button 
                                    onClick={generatePDF}
                                    disabled={loading}
                                    className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors text-sm font-medium shadow-md"
                                >
                                    {loading ? 'Generating...' : <><IconDownload /> Download PDF</>}
                                </button>
                            </div>
                        </div>

                        {/* Preview Area */}
                        <div className="flex-1 overflow-auto p-4 lg:p-8 flex justify-center bg-gray-500/10">
                            
                            {/* THE PDF DOCUMENT RENDER AREA */}
                            <div id="pdf-preview-content" className="a4-paper print-content flex flex-col">
                                
                                {/* Header */}
                                <div className="bg-blue-600 text-white -mx-[20mm] -mt-[20mm] p-[20mm] mb-8">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h1 className="text-3xl font-bold mb-2">Daily Class Update</h1>
                                            <p className="opacity-90 text-lg">{formData.schoolName}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-4xl font-light opacity-80">{new Date(formData.date).getDate()}</div>
                                            <div className="uppercase tracking-wide text-sm font-semibold opacity-80">
                                                {new Date(formData.date).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-6 flex gap-6 text-sm font-medium bg-blue-700/30 p-4 rounded-lg backdrop-blur-sm inline-flex">
                                        <div>
                                            <span className="opacity-70 block text-xs uppercase tracking-wider">Teacher</span>
                                            {formData.teacherName}
                                        </div>
                                        <div className="w-px bg-white/20"></div>
                                        <div>
                                            <span className="opacity-70 block text-xs uppercase tracking-wider">Class</span>
                                            {formData.grade}
                                        </div>
                                        <div className="w-px bg-white/20"></div>
                                        <div>
                                            <span className="opacity-70 block text-xs uppercase tracking-wider">Subject</span>
                                            {formData.subject}
                                        </div>
                                    </div>
                                </div>

                                {/* Main Content */}
                                <div className="space-y-8 flex-1">
                                    
                                    {/* Topic Header */}
                                    <div className="border-b-2 border-blue-100 pb-4">
                                        <span className="text-blue-600 font-bold uppercase tracking-wider text-xs">Today's Topic</span>
                                        <h2 className="text-2xl font-bold text-gray-800 mt-1">{formData.topic}</h2>
                                    </div>

                                    {/* Context & Summary */}
                                    <div className="grid grid-cols-1 gap-6">
                                        <div className="bg-gray-50 p-6 rounded-xl border border-gray-100">
                                            <h3 className="text-blue-800 font-bold mb-3 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                                                Context & Summary
                                            </h3>
                                            <p className="text-gray-600 leading-relaxed whitespace-pre-wrap">{formData.context}</p>
                                        </div>
                                    </div>

                                    {/* Content Covered */}
                                    <div>
                                        <h3 className="text-gray-800 font-bold mb-3 text-lg border-l-4 border-green-400 pl-3">
                                            Key Concepts Covered
                                        </h3>
                                        <div className="bg-white text-gray-700 leading-relaxed whitespace-pre-wrap pl-4">
                                            {formData.contentCovered}
                                        </div>
                                    </div>

                                    {/* Reading/Homework */}
                                    <div className="bg-orange-50 p-4 rounded-lg border-l-4 border-orange-400 flex items-start gap-4">
                                        <div className="p-2 bg-orange-100 rounded-full text-orange-600">
                                            <IconBook />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-orange-900">Homework / Reading</h4>
                                            <p className="text-orange-800 mt-1">{formData.readingAssignment}</p>
                                        </div>
                                    </div>

                                    {/* Questions */}
                                    <div>
                                        <h3 className="text-gray-800 font-bold mb-4 text-lg border-l-4 border-blue-400 pl-3">
                                            5 Questions for Home Review
                                        </h3>
                                        <p className="text-sm text-gray-500 italic mb-4">Parents, please ask your ward these questions to gauge their understanding:</p>
                                        
                                        <div className="space-y-3">
                                            {formData.questions.map((q, i) => (
                                                <div key={i} className="flex gap-4 items-start group">
                                                    <span className="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                                                        Q{i+1}
                                                    </span>
                                                    <div className="bg-white border border-gray-100 shadow-sm p-3 rounded-lg flex-1 text-gray-700 font-medium">
                                                        {q || <span className="text-gray-300 italic">Question content...</span>}
                                                    </div>
                                                </div>
                                            ))}
                                            {formData.questions.length === 0 && (
                                                <p className="text-gray-400 italic">No questions added yet.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Footer */}
                                <div className="mt-auto pt-8 border-t border-gray-200 text-center text-gray-400 text-sm">
                                    <p>Generated by ClassConnect Daily • Helping parents stay in the loop.</p>
                                </div>

                            </div>
                            {/* END PDF RENDER AREA */}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
